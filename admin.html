<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saysa Store Admin</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
padding:20px;
}

.container{
max-width:600px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.15);
}

h2{
text-align:center;
margin-bottom:20px;
}

input,
textarea,
button{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
border:1px solid #ccc;
border-radius:5px;
}

textarea{
height:120px;
resize:none;
}

button{
background:#0d6efd;
color:#fff;
border:none;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#084298;
}

#msg{
margin-top:10px;
text-align:center;
font-weight:bold;
color:green;
}
</style>
</head>

<body>

<div class="container">

<h2>Saysa Store Admin</h2>

<input
type="text"
id="name"
placeholder="Product Name">

<input
type="number"
id="price"
placeholder="Product Price">

<input
type="text"
id="category"
placeholder="Category">

<input
type="file"
id="image"
accept="image/*">

<textarea
id="desc"
placeholder="Product Description"></textarea>

<button id="addProduct">
Add Product
</button>

<p id="msg"></p>

</div>

<script type="module">

  getFirestore,
  collection,

} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-storage.js";
const firebaseConfig = {
apiKey: "AIzaSyBLYDmdpaapDRIq9KANzrR_1vI7gQ6-ATA",
authDomain: "saysa-store.firebaseapp.com",
projectId: "saysa-store",
storageBucket: "saysa-store.firebasestorage.app",
messagingSenderId: "454544076672",
appId: "1:454544076672:web:ea09d92ce3141d7c74db65"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const storage = getStorage(app);

</script>

</body>
</html>
