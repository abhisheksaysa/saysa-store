<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saysa Store Admin</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
}
.container{
max-width:500px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}
input,textarea,button{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
}
button{
background:#0d6efd;
color:#fff;
border:none;
border-radius:5px;
cursor:pointer;
}
button:hover{
background:#084298;
}
</style>
</head>

<body>

<div class="container">
<h2>Saysa Store Admin</h2>

<input type="text" id="name" placeholder="Product Name">

<input type="text" id="price" placeholder="Price">

<input type="text" id="image" placeholder="Image URL">

<textarea id="desc" placeholder="Description"></textarea>

<button>Add Product</button>

</div>

</body>
</html>
